# KidsCall backend: signaling server + coturn (TURN/STUN relay).
#
#   cp server/.env.example server/.env   # edit values
#   docker compose up -d
#
# Put a TLS-terminating reverse proxy (Caddy, nginx, ...) in front of
# port 8080 so the app talks to https://PUBLIC_URL. The server itself
# speaks plain HTTP/WS on 8080 only.
services:
  signaling:
    build: ./server
    restart: unless-stopped
    env_file: ./server/.env
    environment:
      DATA_DIR: /data
    volumes:
      - signaling-data:/data
      - ./secrets:/secrets:ro
    ports:
      - "127.0.0.1:8080:8080"

  coturn:
    image: coturn/coturn:4.6
    restart: unless-stopped
    network_mode: host
    env_file: ./server/.env
    command: >
      turnserver
      --listening-port=3478
      --tls-listening-port=5349
      --min-port=49160 --max-port=49200
      --realm=kidscall
      --use-auth-secret
      --static-auth-secret=${TURN_SECRET}
      --fingerprint
      --no-multicast-peers
      --no-cli
      --no-rfc5780
      --no-stun-backward-compatibility
      --response-origin-only-with-rfc5780
      --cert=/secrets/turn-cert.pem
      --pkey=/secrets/turn-key.pem
      --log-file=stdout
    volumes:
      - ./secrets:/secrets:ro

volumes:
  signaling-data:
