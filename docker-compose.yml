# KidsCall backend: HTTPS front (Caddy) + signaling server + coturn (TURN/STUN).
#
#   ./scripts/setup.sh        # asks for your domain, generates secrets, starts everything
#
# Caddy obtains and renews the Let's Encrypt certificate for DOMAIN automatically
# and proxies https://DOMAIN -> signaling:8080 (WebSocket included).
# Ports to open on the server firewall: 80/tcp, 443/tcp, 3478/udp+tcp, 49160-49200/udp.
services:
  caddy:
    image: caddy:2
    restart: unless-stopped
    env_file: ./server/.env
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - signaling

  signaling:
    build: ./server
    restart: unless-stopped
    env_file: ./server/.env
    environment:
      DATA_DIR: /data
    volumes:
      - signaling-data:/data
      - ./secrets:/secrets:ro
    expose:
      - "8080"

  coturn:
    image: coturn/coturn:4.6
    restart: unless-stopped
    network_mode: host
    env_file: ./server/.env
    command: >
      turnserver
      --listening-port=3478
      --min-port=49160 --max-port=49200
      --realm=kidscall
      --use-auth-secret
      --static-auth-secret=${TURN_SECRET}
      --fingerprint
      --no-multicast-peers
      --no-cli
      --no-tls --no-dtls
      ${TURN_EXTRA_ARGS:-}
      --log-file=stdout

volumes:
  caddy-data:
  caddy-config:
  signaling-data:
