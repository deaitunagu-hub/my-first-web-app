name: ios build
on:
  push:
    paths: ["ios/**", ".github/workflows/ios-build.yml"]
  pull_request:
    paths: ["ios/**", ".github/workflows/ios-build.yml"]
jobs:
  build:
    # Compiles the app without signing to catch build errors:
    #   - Debug for the iOS Simulator
    #   - Release for a real device (same configuration the TestFlight workflow archives)
    runs-on: macos-15
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: simulator-debug
            configuration: Debug
            destination: generic/platform=iOS Simulator
          - name: device-release
            configuration: Release
            destination: generic/platform=iOS
    name: build (${{ matrix.name }})
    steps:
      - uses: actions/checkout@v4
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate Xcode project
        working-directory: ios/KidsCall
        run: xcodegen generate
      - name: Resolve Swift packages
        working-directory: ios/KidsCall
        run: xcodebuild -resolvePackageDependencies -project KidsCall.xcodeproj -scheme KidsCall
      - name: Build (${{ matrix.name }})
        working-directory: ios/KidsCall
        run: |
          set -o pipefail
          xcodebuild build \
            -project KidsCall.xcodeproj \
            -scheme KidsCall \
            -configuration '${{ matrix.configuration }}' \
            -destination '${{ matrix.destination }}' \
            -skipMacroValidation \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            | tee build.log | grep -E "error:|warning: unre|BUILD (SUCCEEDED|FAILED)|\*\* " || true
          grep -q "BUILD SUCCEEDED" build.log
      - name: Show errors
        if: failure()
        working-directory: ios/KidsCall
        run: grep -E "error:" build.log | sort -u | head -100 || true
