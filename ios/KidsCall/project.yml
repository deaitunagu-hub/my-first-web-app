# XcodeGen spec. Generate the Xcode project with:
#   brew install xcodegen
#   cd ios/KidsCall && xcodegen generate
name: KidsCall
options:
  bundleIdPrefix: com.example
  deploymentTarget:
    iOS: "16.0"
  xcodeVersion: "15.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true

packages:
  WebRTC:
    url: https://github.com/stasel/WebRTC.git
    minVersion: 120.0.0
    maxVersion: 200.0.0

settings:
  base:
    SWIFT_VERSION: "5.9"
    IPHONEOS_DEPLOYMENT_TARGET: "16.0"
    TARGETED_DEVICE_FAMILY: "1"
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    DEVELOPMENT_TEAM: ""   # set your Apple Team ID here or in Xcode

targets:
  KidsCall:
    type: application
    platform: iOS
    sources:
      - path: Sources
    dependencies:
      - package: WebRTC
        product: WebRTC
    entitlements:
      path: KidsCall.entitlements
      properties:
        aps-environment: development
    info:
      path: Info.plist
      properties:
        CFBundleDisplayName: KidsCall
        CFBundleShortVersionString: "1.0"
        CFBundleVersion: "1"
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UIBackgroundModes: [audio, voip]
        NSCameraUsageDescription: ビデオ通話で映像を送るためにカメラを使います。
        NSMicrophoneUsageDescription: ビデオ通話で声を送るためにマイクを使います。
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        CFBundleURLTypes:
          - CFBundleURLName: com.example.kidscall
            CFBundleURLSchemes: [kidscall]
        ITSAppUsesNonExemptEncryption: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.kidscall
        CODE_SIGN_STYLE: Automatic
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: NO
        SWIFT_STRICT_CONCURRENCY: minimal
